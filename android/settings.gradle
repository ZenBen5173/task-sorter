/* Task Sorter, as an Android app.

   The game is the same HTML, CSS and JavaScript that runs on the web -
   this project does not fork it or copy it. app/build.gradle has a task
   that stages the repository root into the APK's assets at build time,
   so there is exactly one copy of the game and the app can never be
   built against a stale one. */
pluginManagement {
  repositories { google(); mavenCentral(); gradlePluginPortal() }
}
/* HUAWEI publishes HMS Core and its Gradle plugin on its own Maven
   repository, not on Google's or Maven Central. */
def huaweiRepo = 'https://developer.huawei.com/repo/'
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories { google(); mavenCentral(); maven { url huaweiRepo } }
}
rootProject.name = "Task Sorter"
include ":app"
