/* The AppGallery Connect plugin reads app/agconnect-services.json at
   build time. It is not on the Gradle plugin portal, so it comes in the
   old way, as a buildscript classpath entry from HUAWEI's repository. */
buildscript {
  repositories { google(); mavenCentral(); maven { url 'https://developer.huawei.com/repo/' } }
  dependencies { classpath 'com.huawei.agconnect:agcp:1.9.6.300' }
}
plugins {
  id 'com.android.application' version '8.7.3' apply false
}
